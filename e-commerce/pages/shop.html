<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/shop.css">
</head>

<body>
    <div id="navbar-container"></div>
    <div class="con">
        <div class="shop-con">
            <div class="rate-select">
                <div class="category">
                    <h1>Shop</h1>
                    <input type="text" placeholder="Search..">
                    <div class="c-1">
                        <h2>Category</h2>
                        <ul>
                            <li><a href="">Clothing</a></li>
                            <li><a href="">Footwear</a></li>
                            <li><a href="">Accessories</a></li>
                            <li><a href="">Tablets</a></li>
                        </ul>
                    </div>
                </div>
                <div class="rate">
                    <h2>Rate</h2>
                    <div class="star">
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                    </div>
                    <div class="star">
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>

                    </div>
                    <div class="star">
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>

                    </div>
                    <div class="star">
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>

                    </div>
                    <div class="star">
                        <i class="fa-solid fa-star"></i>

                    </div>
                </div>
            </div>
            <div class="product-page">
                <div class="product">
                    <button>All products</button>
                    <select name="" id="select">
                        <option value="">Sort by</option>
                        <option value="">Newest</option>
                        <option value="">Price: Low to High</option>
                        <option value="">Price: High to Low</option>
                        <option value="">Most Popular</option>
                    </select>
                </div>

                <div class="clothes">
                    <div class="box-img">  <!--1ci-->
                        <img src="/img/t-shirt.png" alt="" class="t-shirt">
                        <p>Hanes Hanes Cotton T-Shirt</p>
                        <h5>19.99$</h5>
                        <div class="star">
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i><span>(62)</span>
                        </div>
                        <button class="add-btn">Add to cart</button>
                    </div>
                    <div class="box-img"> <!--2ci-->
                        <img src="/img/shoes.png" alt="" class="shoes">
                        <p>Nike Nike Running Shoes</p>
                        <h5>89.99$</h5>
                        <div class="star">
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i><span>(65)</span>
                        </div>
                        <button class="add-btn">Add to cart</button>
                    </div>
                    <div class="box-img"> <!--3cu-->
                        <img src="/img/bag.png" alt="" class="bag">
                        <p>Samsonite Samsonite Backpack</p>
                        <h5>79.99$</h5>
                        <div class="star">
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i><span>(42)</span>
                        </div>
                        <button class="add-btn">Add to cart</button>
                    </div>
                    <div class="box-img"> <!--4cu-->
                        <img src="/img/IPad2.png" alt="" class="ipad">
                        <p>Apple Apple Ipad Pro</p>
                        <h5>899.99$</h5>
                        <div class="star">
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i>
                            <i class="fa-solid fa-star"></i><span>(47)</span>
                        </div>
                        <button class="add-btn">Add to cart</button>
                    </div>
                </div>
            </div>
        </div>

    </div>
    <div id="footer-container"></div>
    <script src="../js/shop.js"></script>
    <script src="../js/load-footer.js"></script>
    <script src="../js/load-navbar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
