<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Product</title>
    <link rel="stylesheet" href="../css/create-product.css">
</head>
<body>
    <div id="navbar-container2"></div> 

    <div class="form-container">
        <h1>Create product</h1>
        
        <form class="product-form">
            <div class="form-group">
                <label for="brand">Brand</label>
                <input type="text" id="brand" name="brand">
            </div>

            <div class="form-group">
                <label for="model">Model</label>
                <input type="text" id="model" name="model">
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <input type="text" id="category" name="category">
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="5"></textarea>
            </div>

            <div class="form-group">
                <label for="price">Price</label>
                <input type="number" id="price" name="price" step="0.01">
            </div>

            <div class="form-group">
                <label for="rating">Rating</label>
                <input type="number" id="rating" name="rating" min="1" max="5" step="0.1">
            </div>

            <div class="form-group">
                <label for="imageUrl">Image URL</label>
                <input type="url" id="imageUrl" name="imageUrl">
            </div>

            <div class="preview-box">
                <img src="" alt="Preview" id="product-preview" style="display: none;">
                <span class="preview-text">Preview</span>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-save">Save</button>
                <button type="reset" class="btn-reset">Reset</button>
            </div>
        </form>
    </div>

    
    <div id="footer-container"></div>

    
     <script src="../js/create-product.js"></script>
    <script src="../js/load-footer.js"></script>
    <script src="../js/load-navbar2.js"></script>
    
</body>
</html>
