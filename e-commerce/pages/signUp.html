<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/signUp.css">
</head>

<body>
    <div id="navbar-container2"></div>
    <div class="con">

        <div class="signUp">
            <h1>Create an account</h1>
            <form action="#" method="post">
                <div class="account">
                    <label for="reg-name">Name</label>
                    <input type="text" for="reg-name" name="firstname" autocomplete="given-name">
                </div>
                <div class="account">
                    <label for="reg-surname">Surname</label>
                    <input type="text" for="reg-surname" name="lastname" autocomplete="family-name">
                </div>
                <div class="account">
                    <label for="reg-email">Email</label>
                    <input type="email" for="reg-email" name="email" autocomplete="email">   
                </div>
                <div class="account">
                    <label for="reg-username">Username</label>
                    <input type="text" for="reg-username" name="username" autocomplete="username">
                </div>
                <div class="account">
                    <label for="reg-password">Password</label>
                    <input type="password" for="reg-password" name="password" autocomplete="new-password">
                </div>
                <div class="account">
                    <input type="submit" value="Create account" class="btn">
                    <p>Already have account? <a href="../pages/login.html">Log in</a></p>
                </div>
            </form>
        </div>
    </div>
    <div id="footer-container"></div>
    <script src="../js/signUp.js"></script>
    <script src="../js/load-footer.js"></script>
    <script src="../js/load-navbar2.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
