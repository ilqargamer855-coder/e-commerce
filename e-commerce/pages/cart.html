<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/cart.css">
</head>

<body>
    <div id="navbar-container2"></div>

    <div class="con">

        <div class="product">
            <h1>Cart</h1>
            <table>
                <tr>
                    <th>Product</th>
                    <th id="nem">Price</th>
                    <th>Quantity</th>
                    <th>Subtotal</th>
                    <th></th>
                </tr>
                <tr>
                    <td id="img-box"><img src="/img/t-shirt.png" alt="">Hanes Hanes Cotton T-Shirt</td>
                    <td>19.99$</td>
                    <td><input type="number" name="" class="numInp" value="1" min="1" max="99"></td>
                    <td>19.99$</td>
                    <td><button class="remove">Remove</button></td>
                </tr>
                <tr>
                    <td id="img-box"><img src="../img/shoes.png" alt="">Nike Nike Running Shoes</td>
                    <td>89.99$</td>
                    <td><input type="number" name="" class="numInp" value="1" min="1" max="99"></td>
                    <td>89.99$</td>
                    <td><button class="remove">Remove</button></td>
                </tr>
                <tr>
                    <td id="img-box"><img src="../img/bag.png" alt="">Samsonite Samsonite Backpack</td>
                    <td>79.99$</td>
                    <td><input type="number" name="" class="numInp" value="1" min="1" max="99"></td>
                    <td>79.99$</td>
                    <td><button class="remove">Remove</button></td>
                </tr>
            </table>
        </div>
        <div class="total">
            <h1>Cart Total</h1>
            <p>Subtotal<span>189.99999999999999999999$</span></p>
            <p>Shipping<span>Free</span></p>
            <p>Total<span>189.99999999999999999999$</span></p>
            <button id="checkout"><a href="../pages/checkout.html">Procees to checkout</a></button>
        </div>
    </div>


    <div id="footer-container"></div>
    <script src="../js/load-footer.js"></script>
    <script src="../js/load-navbar2.js"></script>
    <script src="/js/cart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
